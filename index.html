<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hanzi Catalogue</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <script type="text/javascript" src="scripts.js"></script>
</head>

<body>

  <header>
    <h1 id="title">Hanzi Collection</h1>
    <h2 id="title-desc">A catalogue of nearly 10,000 Chinese characters with interactive writing animations.</h2>

    <nav id="navBar">

      <label for="filterOptions">Filter by:</label>
      <select id="filterOptions">
        <option value="frequency">Most commonly used</option>
        <option value="strokeAsc">Least writing strokes</option>
        <option value="strokeDesc">Most writing strokes</option>
      </select>

      <label for="searchContainer">Search by pinyin or glyph:</label>
      <div id="searchContainer">
        <input type="text" id="searchBar" placeholder="Ex. Try 'shui' or 水" onkeyup="searchByPinyin()">
        <div id="searchResults"></div>
      </div>
    </nav>
  </header>


  <main>
    <div id="character-grid">
      </div>

      <!-- Add more cards as needed -->
    </div>
  </main>

  <footer>
    <p>© 2025 Hanzi Catalogue</p>
  </footer>
</body>
</html>
