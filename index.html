<!DOCTYPE html>
<html>
  <head>
    <title>Hanzi Catalogue</title>
    <meta name="description" content="A Catalog of Shows Set in Los Angeles" />
    <link rel="stylesheet" href="style.css" />
    <script type="text/javascript" src="scripts.js"></script>
  </head>

  <body>


    <header class="main-header">
      <h1 class="title">Hanzi Catalogue</h1>
    </header>

    <label for="filterOptions">Filter by:</label>
    <select id="filterOptions">
      <option value="frequency">Most commonly used</option>
      <option value="strokeAsc">Number of strokes -- ascending</option>
      <option value="strokeDesc">Number of strokes -- descending</option>
    </select>

    <div id="searchContainer">
      <input type="text" id="searchBar" placeholder="Search by pinyin..." onkeyup="searchByPinyin()">
      <div id="searchResults"></div>
    </div>

    <div id="character-grid">
    </div>

    <div class="footer">
    </div>
  </body>
</html>
