<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hanzi Catalogue</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <script type="text/javascript" src="scripts.js"></script>
</head>

<body>

  <header>
    <h1 id="title">Hanzi Collection</h1>
    <nav id="navBar">

      <label for="filterOptions">Filter by:</label>
      <select id="filterOptions">
        <option value="frequency">Most commonly used</option>
        <option value="strokeAsc">Number of strokes -- ascending</option>
        <option value="strokeDesc">Number of strokes -- descending</option>
      </select>

      <div id="searchContainer">
        <input type="text" id="searchBar" placeholder="Search by pinyin or glyph..." onkeyup="searchByPinyin()">
        <div id="searchResults"></div>
      </div>
    </nav>
  </header>


  <main>
    <div id="character-grid">
      </div>

      <!-- Add more cards as needed -->
    </div>
  </main>

  <footer>
    <p>© 2025 Hanzi Catalogue</p>
  </footer>
</body>
</html>
